<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>个人知识助手 v1</title>
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f8fafc}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 110px}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#6b7280;font-size:13px;margin-bottom:18px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
  .answer{white-space:pre-wrap;line-height:1.8;min-height:90px}
  .sources{margin-top:12px;padding-top:12px;border-top:1px dashed #e5e7eb;
           font-size:13px;color:#6b7280;display:none}
  .meta{font-size:12px;color:#9ca3af;margin-top:10px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb}
  .bar-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;gap:8px}
  input{flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px}
  button{padding:12px 20px;border:0;border-radius:10px;background:#2563eb;color:#fff}
  .refused{color:#b45309}
</style></head>
<body>
<div class="wrap">
  <h1>个人知识助手 v1</h1>
  <div class="sub">基于 docs/ 回答，带引用；没有依据会拒答。</div>
  <div class="card">
    <div id="answer" class="answer">问点什么，比如「RAG 有哪几个步骤？」</div>
    <div id="sources" class="sources"></div>
    <div id="meta" class="meta"></div>
  </div>
</div>
<div class="bar"><div class="bar-in">
  <input id="q" placeholder="输入问题，回车发送" autofocus>
  <button id="send">发送</button>
</div></div>
<script>
const q=document.getElementById('q'),send=document.getElementById('send');
const a=document.getElementById('answer'),src=document.getElementById('sources'),meta=document.getElementById('meta');
async function ask(){
  const question=q.value.trim(); if(!question)return;
  q.value='';send.disabled=true;a.textContent='';a.classList.remove('refused');
  src.style.display='none';meta.textContent='检索中……';
  try{
    const res=await fetch('/ask/stream',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question})});
    if(!res.ok){a.textContent='请求失败：'+res.status;return;}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:'))continue;
        const d=line.slice(5).trim(); if(d==='[DONE]')continue;
        let e;try{e=JSON.parse(d)}catch(_){continue}
        if(e.type==='sources'){
          if(!e.sources.length){meta.textContent='未检索到资料';}
          else{src.innerHTML=e.sources.map(s=>`<div>[${s.index}] ${s.source} · 相似度 ${s.score}</div>`).join('');
               src.style.display='block';meta.textContent='生成中……';}
        }else if(e.type==='delta'){a.textContent+=e.text;}
        else if(e.type==='refused'){a.textContent=e.text;a.classList.add('refused');}
        else if(e.type==='done'){
          const u=e.usage||{};
          meta.textContent=`${(e.latency_ms/1000).toFixed(2)}s · token ${u.prompt_tokens||0}→${u.completion_tokens||0} · $${(e.cost||0).toFixed(6)}`;
        }
      }
    }
  }catch(err){a.textContent='出错了：'+err;}
  finally{send.disabled=false;q.focus();}
}
send.addEventListener('click',ask);
q.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
</script>
</body></html>
