<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #f6f7fb; font-family: "Microsoft YaHei", sans-serif; color: #12141a; }
    .wrap { display: flex; gap: 40px; padding: 40px 48px; align-items: flex-start; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .big { width: 240px; height: 240px; border-radius: 20px; box-shadow: 0 12px 28px rgba(16,24,40,.12); }
    .small { width: 32px; height: 32px; border-radius: 8px; }
    .tiny { width: 20px; height: 20px; border-radius: 5px; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; color: #6b7280; text-align: center; line-height: 1.6; max-width: 240px; }
    .sizes { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; padding: 30px 48px 0; }
    p { margin: 0; padding: 0 48px; color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
  <h1>个人知识助手 · Logo 方案</h1>
  <p>下方是小尺寸效果（32px / 20px），用于浏览器标签和顶栏。</p>
  <div class="wrap">
    <div class="item">
      <img class="big" src="logo-a.svg" />
      <div class="label">A · 书页 + 对话</div>
      <div class="sizes"><img class="small" src="logo-a.svg" /><img class="tiny" src="logo-a.svg" /></div>
      <div class="sub">强调「知识 + 问答」，最直白</div>
    </div>
    <div class="item">
      <img class="big" src="logo-b.svg" />
      <div class="label">B · 文档堆 + 检索</div>
      <div class="sizes"><img class="small" src="logo-b.svg" /><img class="tiny" src="logo-b.svg" /></div>
      <div class="sub">强调「知识库 + 检索」，工具感强</div>
    </div>
    <div class="item">
      <img class="big" src="logo-c.svg" />
      <div class="label">C · 节点 + Agent</div>
      <div class="sizes"><img class="small" src="logo-c.svg" /><img class="tiny" src="logo-c.svg" /></div>
      <div class="sub">强调「Agent / 工具编排」，科技感强</div>
    </div>
  </div>
</body>
</html>
